server:
  port: 9898

spring:
  application:
    name: spring-boot-mail-gmail

  # Enable file upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Configure mail properties for Gmail
  mail:
    host: smtp-mail.outlook.com
    port: 587
    username: ${OUTLOOK_USERNAME}
    password: ${OUTLOOK_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Logging configuration
logging:
  level:
    com.sahu.mailservice: debug

# Swagger Configuration
springdoc:
  swagger-ui:
    path: /documentation
  api-docs:
    path: /api-docs
